 log(`${p.name} ${raise?"doubled":"played"} ${p.seen?"seen":"blind"} · Rs ${a}${raise?" · stake Rs "+stake:""}`);advance()}
function doShow(i){const p=pl[i],oo=act().filter(x=>x!==p),o=oo.reduce((m,x)=>ev(x.cards).score>ev(m.cards).score?x:m),a=cost(p,0);pay(p,a);reveal=true;
 const hp=ev(p.cards),ho=ev(o.cards);log(`${p.name} asked for a SHOW against ${oo.map(x=>x.name).join(" & ")} (Rs ${a})`);
 const win=hp.score>ho.score?p:o;finish(win,true)}
let nc=0,lb=null;function nextNow(){clearInterval(nc);$("bX").style.display="none";startRound()}
function endCount(){let n=5;const bn=$("bN"),bx=$("bX");bn.style.display="none";bx.style.display="";bx.textContent=`Exit table (${n}s)`;clearInterval(nc);nc=setInterval(()=>{n--;if(n<=0)nextNow();else bx.textContent=`Exit table (${n}s)`},1000)}
function exitTable(){clearInterval(nc);clearInterval(tv);phase="exit";log("You left the table");$("bX").style.display="none";const b=$("bN");b.style.display="";b.textContent="Play again";b.onclick=()=>connect(newGame);$("msg").textContent="You left the table. Come back anytime!";render()}
function finish(w,shown){clearInterval(tv);phase="end";const amt=pot;w.bal+=pot;w.won=true;if(w.h)w.shown=true;if(shown)w.glowAt=Date.now();const h=ev(w.cards);
 if(shown){reveal=true;log(`${pl.map(p=>p.packed?"":p.name+": "+p.cards.map(cs).join(" ")+" ("+ev(p.cards).name+")").filter(Boolean).join(" | ")}`)}
 log(`🏆 ${w.name} wins Rs ${pot}${shown?" with "+h.name:""}`);
 $("msg").textContent=`${w.h?"You win":w.name+" wins"} Rs ${pot}${shown?" — "+h.name:""}`;
 pot=0;render();endCount();
 if(shown&&h.t>=4){const ace=h.t===6&&h.top===14;celebrate(ace?"THREE ACES!":h.name.toUpperCase()+"!");chime()}else if(w.h)chime();else beep(220,.3,"sawtooth",.05);if(w.h)winFX(amt);else coinFlight(pl.indexOf(w),amt)}
function coinFlight(i){const a=$("pot").getBoundingClientRect(),b=$("s"+i).getBoundingClientRect(),x0=a.left+a.width/2,y0=a.top+a.height/2,dx=b.left+b.width/2-x0,dy=b.top+b.height/2-y0;
 for(let k=0;k<18;k++){const s=22+rnd(10),e=document.createElement("i");e.className="coin";e.style.cssText=`position:fixed;top:${y0-s/2}px;left:${x0-s/2}px;width:${s}px;height:${s}px;z-index:9;pointer-events:none;animation:none`;document.body.appendChild(e);
  const an=e.animate([{transform:"translate(0,0) scale(.5)",opacity:1},{transform:`translate(${dx*.5+rnd(40)-20}px,${dy*.5-60}px) scale(1.1)`,offset:.5},{transform:`translate(${dx}px,${dy}px) scale(.8)`,opacity:.9}],{duration:900+rnd(500),delay:k*70,easing:"ease-in-out",fill:"both"});
  an.onfinish=()=>{e.remove();beep(2400+rnd(1200),.05,"triangle",.04)}}}
function noteStack(a){const L=[];for(const d of[100,50,20,5])while(a>=d&&L.length<60){L.push(d);a-=d}
 return L.slice(0,8).map((d,k)=>`<img class="nt" alt="Rs ${d}" src="${NOTE[d]}" style="--r:${((k*37)%11)-5}deg">`).join("")}
function flyNotes(i,a){const s=$("s"+i),p=$("pot");if(!s||!p)return;const W=innerWidth<600?72:92,A=s.getBoundingClientRect(),B=p.getBoundingClientRect(),x0=A.left+A.width/2,y0=A.top+A.height/2,dx=B.left+B.width/2-x0,dy=B.top+B.height/2-y0;
 const L=[];let r=a;for(const d of[100,50,20,5])while(r>=d&&L.length<3){L.push(d);r-=d}
 L.forEach((d,k)=>{const e=document.createElement("img");e.src=NOTE[d];e.style.cssText=`position:fixed;left:${x0-W/2}px;top:${y0-W/4}px;width:${W}px;z-index:9;pointer-events:none;border-radius:3px;box-shadow:0 4px 10px #000a`;document.body.appendChild(e);
  e.animate([{transform:"translate(0,0) rotate(0deg) scale(.8)",opacity:1},{transform:`translate(${dx}px,${dy}px) rotate(${rnd(40)-20}deg) scale(1)`,opacity:.95}],{duration:650,delay:k*110,easing:"ease-out",fill:"both"}).onfinish=()=>e.remove()})}
function winFX(amt){const c=$("coins");let h=`<div class="winb"><small>YOU WIN</small><b>Rs ${amt}</b></div>`;
 for(let i=0;i<45;i++){const s=20+rnd(20);h+=`<i class="coin" style="left:${rnd(100)}%;width:${s}px;height:${s}px;animation-duration:${1.8+rnd(1.4)}s;animation-delay:${rnd(1.8)}s"></i>`}
 for(let i=0;i<32;i++){const s=22+rnd(22),a=rnd(6.283),r=120+rnd(220);h+=`<i class="coin fly" style="width:${s}px;height:${s}px;--dx:${Math.cos(a)*r}px;--dy:${Math.sin(a)*r*.7-80}px;animation-duration:${2+rnd(1)}s;animation-delay:${rnd(.4)}s"></i>`}
 c.innerHTML=h;
 for(let k=0;k<26;k++)setTimeout(()=>{beep(2200+rnd(1800),.07,"triangle",.045);beep(3300+rnd(1500),.05,"sine",.03)},k*75+rnd(30));
 [523,659,784,1047,1319].forEach((f,i)=>setTimeout(()=>beep(f,.35,"triangle",.09),i*130));
 setTimeout(()=>[1047,1319,1568].forEach(f=>beep(f,.9,"sine",.07)),800);
 setTimeout(()=>c.innerHTML="",5200)}
function celebrate(t){const f=$("fx");f.innerHTML=`<h2>${t}</h2>`;for(let i=0;i<28;i++){const e=document.createElement("i");e.textContent=["♠","♥","♦","♣","✨","🪙"][i%6];e.style.left=rnd(100)+"%";e.style.animationDelay=rnd(1)+"s";f.appendChild(e)}setTimeout(()=>f.innerHTML="",3200)}
const oS=i=>act().find(x=>x!==pl[i]).seen;
function ai(){if(phase!=="play"||turn===0)return;const i=turn,p=pl[i],P=p.p,d=1,n=act().length;if(!p.seen&&stake>BLINDMAX)doSee(i);
 if(!p.seen){const pr=(.2+p.turns*.14+(stake>=20?.3:0))*(1-P.agg*.4)*(P.blind?.25:.55);if(rnd(1)<pr)doSee(i)}
 const afford=cost(p,0)<=p.bal,canRaise=affordsRaise(i);
 if(!afford){log(`${p.name} packed — not enough money`);return doPack(i)}
 if(!p.seen){if(stake>=40&&!P.blind&&rnd(1)<.15)return doPack(i);if(p.turns>1&&rnd(1)<(.12+P.agg*.2)*(n===2?1:.5))return doShow(i);if(canRaise&&rnd(1)<.2+P.agg*.5)return doBet(i,true);return doBet(i,false)}
 const hv=ev(p.cards),op=n-1;let eq=Math.pow(pctl(hv.score),op);
 if(lastRaiser>=0&&lastRaiser!==i&&pl[lastRaiser].seen)eq*=.9;
 const c=cost(p,0),odds=c/(pot+c);let thr=odds*.7+P.fold*.6-.1+(n>2?Math.min(.2,pot/15000):0);
 if(p.turns<2&&stake<=10)thr-=.08;if(c>p.bal*.35&&eq<.5)thr+=.12;
 const bluff=rnd(1)<P.bluff*.6;
 if(eq<thr&&!bluff)return doPack(i);
 if(n===2&&(oS(i)||pot>1000)&&((eq>.6&&rnd(1)<.45)||(eq>.42&&pot>=200&&rnd(1)<.3)||rnd(1)<.1+Math.min(.6,pot/6000+p.turns*.03)))return doShow(i);
 if(canRaise&&((eq>.58&&rnd(1)<.3+P.agg*.5)||(bluff&&rnd(1)<P.agg*.4)))return doBet(i,true);
 doBet(i,false)}
function cardHTML(c,show,g){if(!show)return'<div class="card b"></div>';const red=c.s===1||c.s===2;return`<div class="card ${red?"r":""}${g!=null?" glow":""}"${g!=null?` style="animation-delay:-${g}s"`:""}><span>${cs(c)}</span></div>`}
function seat(i){const p=pl[i];if(p.gone){const e=$("s"+i);e.className="seat out";e.innerHTML=`<div class="av" style="background:#333">?</div><div class="nm">Waiting for new player…</div><div class="st">${p.wc}s</div>`;return}const show=p.cards&&(i===0?(p.seen||p.shown||reveal||phase==="end"&&!p.packed&&reveal):(reveal&&!p.packed));
 const gl=p.glowAt&&show&&Date.now()-p.glowAt<5000?(Date.now()-p.glowAt)/1000:null;const st=p.packed?"Packed":p.seen?"Seen":"Blind";
 const el=$("s"+i);el.className="seat"+(turn===i&&phase==="play"?" turn":"")+(p.packed?" out":p.seen?" sn":" bl")+(p.won?" won":"");
 el.innerHTML=`${turn===i&&phase==="play"?`<div class="tm${tl<=5?" lo":""}"><svg viewBox="0 0 46 46"><circle class="bg" cx="23" cy="23" r="19"/><circle class="fg" cx="23" cy="23" r="19" style="animation-delay:-${10-tl}s"/></svg><span>${tl}</span></div>`:""}<div class="av" style="background:${p.col}">${p.name[0]}</div><div class="nm">${p.name}${p.p?` · <span class="st">${p.p.n}</span>`:""}</div><div class="st s-${st}">${st}${turn===i&&phase==="play"&&i!==0?" · thinking…":""}</div>
 <div class="cards">${p.cards?p.cards.map(c=>cardHTML(c,show,gl)).join(""):""}</div><div class="bal">Rs ${p.bal} · in ${p.paid||0}</div>`}
function render(){if(!pl)return;$("s3").style.display=pl.length>3?"":"none";pl.forEach((_,i)=>seat(i));$("pot").textContent=pot;{const b=$("big");b.textContent=phase==="play"?(turn===0?"Your turn":pl[turn].name)+" · "+tl+"s":"";b.classList.toggle("warn",tl<=3)}{const w=$("wb"),v=pl[0].bal;w.textContent="Rs "+v;if(lb!==null&&v!==lb){w.className=v>lb?"up":"dn";clearTimeout(w._t);w._t=setTimeout(()=>w.className="",1200)}lb=v}
 if(window._pk!==pot){$("chips").innerHTML=noteStack(pot);window._pk=pot}
 const me=pl[0],my=turn===0&&phase==="play"&&!me.packed,n=pl?act().length:0;
 const c1=cost(me,0),c2=cost(me,1);
 $("bC").textContent=`${me.seen?"Chaal":"Blind"} ${c1}`;$("bR").textContent=`Double ${c2}`;
 $("bC").disabled=!my||me.bal<c1||(!me.seen&&c1>BLINDMAX);$("bR").disabled=!my||!affordsRaise(0);
 $("bS").disabled=phase!=="play"||me.seen||me.packed;$("bP").disabled=!my;
 $("bH").textContent=`Show ${c1}`;$("bH").disabled=!my||(me.seen&&(n!==2||(!act().find(x=>x!==me).seen&&pot<=1000)))||me.bal<c1;
 if(phase==="play"&&!$("msg").textContent.startsWith("You’re"))$("msg").textContent=my?(me.bal<c1?"Not enough money — your cards will be packed":me.seen?"Your turn — you can see your cards":"Your turn — playing blind"):"";}
$("bC").onclick=()=>doBet(0,false);$("bR").onclick=()=>doBet(0,true);$("bS").onclick=()=>doSee(0);
$("bP").onclick=()=>doPack(0);$("bH").onclick=()=>doShow(0);$("bN").onclick=nextNow;$("bX").onclick=exitTable;
$("ng").onclick=()=>connect(newGame);$("snd").onclick=e=>{sound=!sound;e.target.textContent=sound?"🔊":"🔇"};
connect(newGame);
</script></body></html>
