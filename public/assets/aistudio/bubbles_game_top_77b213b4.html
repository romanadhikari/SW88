ctx.clearRect(0,0,W,H);ctx.lineWidth=2;ctx.strokeStyle='#6a8dff';ctx.beginPath();ctx.moveTo(0,TOP);ctx.lineTo(W,TOP);ctx.stroke();

G.forEach((row,r)=>row.forEach((b,c)=>{if(b){const[x,y]=pos(r,c);blit(x,y,b,b.x?1+.04*Math.sin(t/260):1)}}));fall.forEach(f=>blit(f.x,f.y,f.b));
ctx.fillStyle='#fff';for(const p of parts){ctx.globalAlpha=p.l;ctx.fillStyle=p.c;ctx.fillRect(p.x-2,p.y-2,4,4)}ctx.globalAlpha=1;
if(st&&!fly&&!st.busy&&!st.over)for(const[x,y,d]of traj()){ctx.fillStyle=d?'#ffffffaa':'#a45cff';ctx.fillRect(x-(d?1.5:3),y-(d?1.5:3),d?3:6,d?3:6)}

if(st&&!fly&&!st.over&&st.shots>0)blit(W/2+Math.cos(ang)*20,LY+Math.sin(ang)*20-2,st.cur,.9);else if(fly)blit(fly.x,fly.y,fly);
ctx.textAlign='center';ctx.font='800 17px Sora,Noto Sans Devanagari,sans-serif';for(const f of fl){ctx.globalAlpha=Math.min(1,f.l);ctx.lineWidth=4;ctx.strokeStyle='#000a';ctx.strokeText(f.t,f.x,f.y);ctx.fillStyle=f.c;ctx.fillText(f.t,f.x,f.y)}ctx.globalAlpha=1}

if(!st){H=Math.max(460,Math.min(820,Math.round(W*ch/cw)));cv.width=W*DPR;cv.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0);LINEY=H-150;LY=H-52;LOSE_R=Math.ceil((LINEY-TOP-2*R)/RH);GR=LOSE_R+3}
const f=Math.min(cw/W,ch/H);cv.style.width=W*f+'px';cv.style.height=H*f+'px'}

<script>
(function(){
  var origStart = start;
  var origLand = land;
  var origFinish = finish;
  var origBuild = build;

  var mode = 'normal';   // 'easy' | 'hard' | 'normal'
  var rig = 'normal';    // 'normal' | 'late' | 'trap'
  var hardenAt = 2;      // transition after this many shots complete

  function randInt(n){ return Math.floor(Math.random()*n); }

  function countByColor(){
    var count = {};
    if (!G) return count;
    for (var r = 0; r < G.length; r++){
      for (var c = 0; c < G[r].length; c++){
        var b = G[r][c];
        if (b) count[b.c] = (count[b.c] || 0) + 1;
      }
    }
    return count;
  }

  function freezeBubbles(pct){
    if (!G) return;
    var cand = [];
    for (var r = 0; r < G.length; r++){
      for (var c = 0; c < G[r].length; c++){
        var b = G[r][c];
        if (b && b.hp === 1 && b.t === 'n') cand.push([r, c]);
      }
    }
    var n = Math.floor(cand.length * pct);
    for (var i = 0; i < n; i++){
      if (!cand.length) break;
      var idx = randInt(cand.length);
      var p = cand.splice(idx, 1)[0];
      var b2 = G[p[0]][p[1]];
      if (b2){ b2.hp = 2; b2.t = 'frozen'; }
    }
  }

  function freezeRandomCount(n){
    if (!G) return;
    var cand = [];
    for (var r = 0; r < G.length; r++){
      for (var c = 0; c < G[r].length; c++){
        var b = G[r][c];
        if (b && b.hp === 1 && b.t === 'n') cand.push([r, c]);
      }
    }
    n = Math.min(n, cand.length);
    for (var i = 0; i < n; i++){
      if (!cand.length) break;
      var idx = randInt(cand.length);
      var p = cand.splice(idx, 1)[0];
      var b2 = G[p[0]][p[1]];
      if (b2){ b2.hp = 2; b2.t = 'frozen'; }
    }
  }

  function steerEasy(){
    if (!st || !G) return;
    var count = countByColor();
    var keys = Object.keys(count);
    if (!keys.length) return;
    keys.sort(function(a, b){ return count[b] - count[a]; });
    var pick = keys[randInt(Math.min(2, keys.length))];
    st.cur.c = +pick;
    if (st.nxt) st.nxt.c = +pick;
    setRk();
  }

  function steerHard(){
    if (!st || !G) return;
    var count = countByColor();
    var keys = Object.keys(count);
    if (!keys.length) return;
    keys.sort(function(a, b){ return count[a] - count[b]; });
    var half = Math.max(1, Math.floor(keys.length / 2));
    var pick = keys[randInt(half)];
    st.cur.c = +pick;
    if (st.nxt) st.nxt.c = +pick;
    setRk();
  }

  build = function(){
    if (mode === 'normal') return origBuild();

    par = 0;
    G = [];
    var k, fz, rows, clusterBias, holeChance;

    if (mode === 'easy'){
      k = 4;
      fz = 0;
      rows = LOSE_R - 2;
      clusterBias = 0.55;
      holeChance = 0.15;
    } else {
      k = 6;
      fz = (rig === 'trap') ? 0.5 : 0.4;
      rows = LOSE_R - 1;
      clusterBias = 0.08;
      holeChance = 0.05;
    }

    for (var r = 0; r < GR; r++){
      var rowArr = [];
      for (var c = 0; c < cols(r); c++) rowArr.push(null);
      G.push(rowArr);
      if (r < rows){
        for (var c2 = 0; c2 < cols(r); c2++){
          if (r > 0 && Math.random() < holeChance) continue;
          var col = rnd(k);
          var l = c2 > 0 ? G[r][c2-1] : null;
          var u = r > 0 ? G[r-1][Math.min(c2, cols(r-1)-1)] : null;
          if (Math.random() < clusterBias){
            var s = [];
            if (l) s.push(l.c);
            if (u) s.push(u.c);
            if (s.length) col = s[rnd(s.length)];
          }
          var b3 = mk(col, xval());
          if (Math.random() < fz){ b3.hp = 2; b3.t = 'frozen'; }
          G[r][c2] = b3;
        }
      }
    }
    drop(true);
    gv++;
  };

  start = function(){
    if (S.bet >= 50){
      if (Math.random() < 0.25){
        rig = 'trap';
        mode = 'hard';
        hardenAt = 0;
      } else {
        rig = 'late';
        mode = 'easy';
        hardenAt = 2;
      }
    } else {
      rig = 'normal';
      mode = 'normal';
      hardenAt = 99;
    }

    origStart();

    if (mode === 'easy') steerEasy();
    else if (mode === 'hard') steerHard();
  };

  land = function(){
    origLand();
    if (!st || st.over) return;
    if (rig === 'normal') return;

    var shot = 5 - st.shots;

    if (rig === 'late' && mode === 'easy' && shot >= hardenAt){
      mode = 'hard';
      freezeBubbles(0.7);
      gv++;
    }

    if (mode === 'hard' && shot >= 1){
      freezeRandomCount(2);
      gv++;
    }

    if (mode === 'easy') steerEasy();
    else if (mode === 'hard') steerHard();
  };

  finish = function(out){
    origFinish(out);
    mode = 'normal';
    rig = 'normal';
    save();
  };
})();
</script>
